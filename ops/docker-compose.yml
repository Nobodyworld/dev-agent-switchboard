
services:
  switchboard:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ../storage:/app/storage
      - ../.agent:/app/.agent
      - ../AGENTS.md:/app/AGENTS.md:ro
      - ../README.md:/app/README.md:ro
      - ../ops/logging.ini:/app/ops/logging.ini:ro
      - ../ops/otel.yaml:/app/ops/otel.yaml:ro
    environment:
      - TZ=UTC
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:////app/storage/switchboard.db}
      - STORAGE_ROOT=${STORAGE_ROOT:-/app/storage}
      - FILES_ROOT=${FILES_ROOT:-/app/storage/files}
      - SWITCHBOARD_RATE_LIMIT_REQUESTS=${SWITCHBOARD_RATE_LIMIT_REQUESTS:-120}
      - SWITCHBOARD_RATE_LIMIT_WINDOW_SECONDS=${SWITCHBOARD_RATE_LIMIT_WINDOW_SECONDS:-60}
      - SWITCHBOARD_RATE_LIMIT_TRUSTED_BYPASS=${SWITCHBOARD_RATE_LIMIT_TRUSTED_BYPASS:-}
      - SWITCHBOARD_LEASE_SECONDS=${SWITCHBOARD_LEASE_SECONDS:-300}
      - SWITCHBOARD_LOGGING_CONFIG=${SWITCHBOARD_LOGGING_CONFIG:-}
      - SWITCHBOARD_ENABLE_STRUCTURED_LOGGING=${SWITCHBOARD_ENABLE_STRUCTURED_LOGGING:-0}
      - SWITCHBOARD_ENABLE_METRICS=${SWITCHBOARD_ENABLE_METRICS:-0}
      - SWITCHBOARD_ENABLE_TRACING=${SWITCHBOARD_ENABLE_TRACING:-0}
      - SWITCHBOARD_OTEL_CONFIG=${SWITCHBOARD_OTEL_CONFIG:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import sys, urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
