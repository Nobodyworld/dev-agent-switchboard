[loggers]
keys=root,uvicorn,uvicorn_error,uvicorn_access

[handlers]
keys=console

[formatters]
keys=json

[logger_root]
level=INFO
handlers=console

[logger_uvicorn]
level=INFO
handlers=console
qualname=uvicorn
propagate=0

[logger_uvicorn_error]
level=INFO
handlers=console
qualname=uvicorn.error
propagate=0

[logger_uvicorn_access]
level=INFO
handlers=console
qualname=uvicorn.access
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=json
args=(ext://sys.stdout,)

[formatter_json]
class=pythonjsonlogger.json.JsonFormatter
format=%(asctime)s %(levelname)s %(name)s %(message)s %(request_id)s
