
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div class="max-w-5xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4">Switchboard</h1>
    <p class="mb-6">Real-time task switchboard & live file host for agents.</p>

    <section class="mb-8 p-4 bg-white rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-2">Create Task</h2>
      <form id="createTask" class="space-y-2">
          <input class="border rounded p-2 w-full" name="title" placeholder="Title" required />
          <textarea class="border rounded p-2 w-full" name="description" placeholder="Description"></textarea>
          <input class="border rounded p-2 w-full" name="depends_on" placeholder="Dependencies (comma ids)" />
          <button type="submit" class="px-3 py-2 rounded bg-blue-600 text-white">Add</button>
        </form>
    </section>

    <section class="mb-8 p-4 bg-white rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-2">Live Docs</h2>
      <ul class="list-disc list-inside space-y-1">
        <li><a class="text-blue-600 hover:underline" href="/live/docs/ExecPlan" target="_blank" rel="noopener">ExecPlan</a></li>
        <li><a class="text-blue-600 hover:underline" href="/live/docs/AGENTS.md" target="_blank" rel="noopener">AGENTS.md</a></li>
      </ul>
    </section>

    <section class="p-4 bg-white rounded-xl shadow">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h2 class="text-xl font-semibold">Tasks</h2>
          <div id="planMeta" class="plan-meta hidden" aria-live="polite">
            <span>Plan version <strong id="planVersion">—</strong></span>
            <span aria-hidden="true">•</span>
            <span>Last updated <time id="planUpdated" datetime="">—</time></span>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <label for="statusFilter" class="text-sm font-medium text-gray-700">Status</label>
          <select id="statusFilter" class="border rounded px-2 py-1 text-sm">
            <option value="all">All</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <button id="refreshTasks" class="px-3 py-2 rounded bg-gray-800 text-white">Refresh</button>
        </div>
      </div>
      <div id="tasks" class="mt-4">
        <!-- Rendered via htmx refresh -->
      </div>
    </section>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
