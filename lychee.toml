# Configuration for lychee link checker
cache = true
max_retries = 2
retry_wait_time = 2
user_agent = "switchboard-ci-link-checker/1.0"
format = "markdown"
output = "lychee/out.md"

# Local development URLs are examples, not externally reachable links.
# Private-repository issue URLs return 404 to unauthenticated CI even when valid.
exclude = [
  "^http://localhost",
  "^https://github\\.com/Nobodyworld/dev-agent-switchboard/issues/[0-9]+$",
]
