# Label schema for Switchboard. Sync with `github-label-sync` or your preferred automation.
- name: type/bug
  color: d73a4a
  description: "Something is not working"
- name: type/feature
  color: a2eeef
  description: "New feature request"
- name: type/docs
  color: 1d76db
