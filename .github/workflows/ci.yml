name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      run_fmt:
        description: 'Run make fmt'
        required: false
        default: false
        type: boolean
      run_lint:
        description: 'Run make lint'
        required: false
        default: false
        type: boolean
      run_typecheck:
        description: 'Run make typecheck'
        required: false
        default: false
        type: boolean

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run test suite
        run: python scripts/run_pytest.py

      - name: Run formatter (optional)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_fmt) || (github.event_name != 'workflow_dispatch' && vars.CI_RUN_FMT == 'true') }}
        run: make fmt

      - name: Run linter (optional)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_lint) || (github.event_name != 'workflow_dispatch' && vars.CI_RUN_LINT == 'true') }}
        run: make lint

      - name: Run type checks (optional)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_typecheck) || (github.event_name != 'workflow_dispatch' && vars.CI_RUN_TYPECHECK == 'true') }}
        run: make typecheck
