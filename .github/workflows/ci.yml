name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, typecheck, test, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
          pip install pre-commit

      - name: Run pre-commit (lint + format checks)
        if: matrix.stage == 'lint'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate TODO annotations
        if: matrix.stage == 'lint'
        run: python scripts/dev.py check-todos --root .

      - name: Run mypy
        if: matrix.stage == 'typecheck'
        run: |
          mypy --config-file mypy.ini server client scripts

      - name: Run pytest
        if: matrix.stage == 'test'
        run: |
          mkdir -p reports
          pytest --maxfail=1 --disable-warnings --junitxml=reports/pytest.xml

      - name: Run security scanners
        if: matrix.stage == 'security'
        run: |
          bandit -q -r server
          pip-audit --progress-spinner=off

      - name: Upload pytest report
        if: matrix.stage == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            README.md REPORT.md PLAN.md docs/**/*.md

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secrets audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run coverage suite
        run: |
          mkdir -p reports
          pytest --cov=server/extensions --cov=server/application/task_service.py --cov-report=term-missing --cov-report=json:reports/coverage.json

      - name: Enforce coverage thresholds
        run: |
          python scripts/dev.py coverage-gate --json reports/coverage.json \
            --module server/extensions/interfaces.py=85 \
            --module server/extensions/loader.py=85 \
            --module server/extensions/runtime.py=85 \
            --module server/extensions/builtin/task_metrics.py=85

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: reports/coverage.json
          if-no-files-found: error
          retention-days: 7
