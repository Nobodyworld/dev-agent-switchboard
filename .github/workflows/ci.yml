name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, typecheck, test, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
          pip install pre-commit

      - name: Run pre-commit
        if: matrix.stage == 'lint'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate TODO annotations
        if: matrix.stage == 'lint'
        run: python scripts/dev.py check-todos --root .

      - name: Run mypy
        if: matrix.stage == 'typecheck'
        run: mypy --config-file mypy.ini server client scripts

      - name: Run pytest
        if: matrix.stage == 'test'
        run: |
          mkdir -p reports
          pytest --maxfail=1 --disable-warnings --junitxml=reports/pytest.xml

      - name: Run security scanners
        if: matrix.stage == 'security'
        run: |
          bandit -q -r server -x server/tests
          pip-audit --progress-spinner=off -r server/requirements-dev.txt

      - name: Upload pytest report
        if: always() && matrix.stage == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  accounting-acceptance:
    name: Accounting workload acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run accounting real-worker acceptance
        run: |
          mkdir -p reports
          pytest \
            client/python/tests/test_execution_worker_server_smoke.py::test_accounting_catalog_routes_real_worker_then_reuses_exact_evidence \
            --junitxml=reports/pytest-accounting.xml -rA

      - name: Enforce exact accounting acceptance result
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('reports/pytest-accounting.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = list(root.iter('failure'))
          errors = list(root.iter('error'))
          skipped = list(root.iter('skipped'))
          if len(cases) != 1 or failures or errors or skipped:
              raise SystemExit(
                  'Accounting acceptance must report exactly one passing test; '
                  f'got tests={len(cases)}, failures={len(failures)}, '
                  f'errors={len(errors)}, skipped={len(skipped)}.'
              )
          print('Accounting acceptance reported exactly one passing test.')
          PY

  zscripts-acceptance:
    name: Zscripts workload acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Set up Node 24.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'

      - name: Set up pnpm 10.18.1
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: '10.18.1'

      - name: Verify exact Zscripts runtime capabilities
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.12.0"
          test "$(pnpm --version)" = "10.18.1"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run Zscripts real-worker acceptance
        run: |
          mkdir -p reports
          pytest \
            client/python/tests/test_execution_worker_server_smoke.py::test_zscripts_catalog_routes_real_worker_then_reuses_exact_evidence \
            --junitxml=reports/pytest-zscripts.xml -rA

      - name: Enforce exact Zscripts acceptance result
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('reports/pytest-zscripts.xml').getroot()
          cases = list(root.iter('testcase'))
          failures = list(root.iter('failure'))
          errors = list(root.iter('error'))
          skipped = list(root.iter('skipped'))
          if len(cases) != 1 or failures or errors or skipped:
              raise SystemExit(
                  'Zscripts acceptance must report exactly one passing test; '
                  f'got tests={len(cases)}, failures={len(failures)}, '
                  f'errors={len(errors)}, skipped={len(skipped)}.'
              )
          print('Zscripts acceptance reported exactly one passing test.')
          PY

