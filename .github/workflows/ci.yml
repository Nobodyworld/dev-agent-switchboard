name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [lint, typecheck, test, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # The trusted accounting workload and its real-worker acceptance require
          # the target repository's supported Python 3.12+ runtime.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
          pip install pre-commit

      - name: Run pre-commit
        if: matrix.stage == 'lint'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate TODO annotations
        if: matrix.stage == 'lint'
        run: python scripts/dev.py check-todos --root .

      - name: Run mypy
        if: matrix.stage == 'typecheck'
        run: mypy --config-file mypy.ini server client scripts

      - name: Run pytest
        if: matrix.stage == 'test'
        run: |
          mkdir -p reports
          pytest --maxfail=1 --disable-warnings --junitxml=reports/pytest.xml

      - name: Run security scanners
        if: matrix.stage == 'security'
        run: |
          bandit -q -r server -x server/tests
          pip-audit --progress-spinner=off -r server/requirements-dev.txt

      - name: Upload pytest report
        if: always() && matrix.stage == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 7

  docs:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install lychee
        shell: bash
        run: |
          set -euo pipefail
          LYCHEE_VERSION="0.24.2"
          TARGET="x86_64-unknown-linux-gnu"
          ARCHIVE="lychee-${TARGET}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          install -m 0755 "/tmp/lychee-${TARGET}/lychee" "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check links
        id: linkcheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p lychee
          lychee --config lychee.toml --no-progress \
            README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
            "docs/**/*.md" \
            --exclude-path docs/history \
            --exclude-path archive \
            2>&1 | tee lychee/console.log

      - name: Show link-check report
        if: always()
        shell: bash
        run: |
          if [[ -f lychee/out.md ]]; then
            cat lychee/out.md
          elif [[ -f lychee/console.log ]]; then
            cat lychee/console.log
          else
            echo "Lychee produced no report or console log."
          fi

      - name: Upload lychee diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lychee-report
          path: lychee/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce link-check result
        if: steps.linkcheck.outcome == 'failure'
        run: exit 1

  secrets:
    name: Secrets audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${ARCHIVE}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Coverage executes the full suite, including the Python 3.12+
          # accounting LocalWorker acceptance.
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run coverage suite
        run: |
          mkdir -p reports
          pytest --cov=server/extensions --cov=server.application.task_service --cov=server.observability --cov=server.application.configuration_service --cov-report=term-missing --cov-report=json:reports/coverage.json

      - name: Enforce coverage thresholds
        run: |
          python scripts/dev.py coverage-gate --json reports/coverage.json \
            --module server/extensions/contracts.py=85 \
            --module server/extensions/interfaces.py=85 \
            --module server/extensions/loader.py=85 \
            --module server/extensions/runtime.py=85 \
            --module server/extensions/builtin/task_metrics.py=85 \
            --module server/extensions/builtin/plan_metrics.py=85 \
            --module server/extensions/builtin/plan_latency.py=80 \
            --module server/extensions/builtin/plan_snapshot.py=80 \
            --module server/extensions/builtin/activity_feed.py=85 \
            --module server/extensions/observability.py=80 \
            --module server/observability/diagnostics.py=80 \
            --module server/observability/health.py=85 \
            --module server/observability/activity.py=80 \
            --module server/observability/overview.py=85 \
            --module server/application/task_service.py=75 \
            --module server/application/configuration_service.py=85

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-json
          path: reports/coverage.json
          if-no-files-found: warn
          retention-days: 7

  browser-ui:
    name: Browser UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run UI module with strict browser enforcement
        env:
          SWITCHBOARD_STRICT_PLAYWRIGHT: '1'
        run: |
          mkdir -p reports
          pytest web/tests/test_ui.py --junitxml=reports/pytest-ui.xml -rA

      - name: Fail if UI tests were skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('reports/pytest-ui.xml').getroot()
          skipped = sum(
              int(node.attrib.get('skipped', '0'))
              for node in root.iter('testsuite')
          )
          if skipped:
              raise SystemExit(
                  f'UI test module reported {skipped} skipped tests; failing by policy.'
              )
          print('UI module executed without skips.')
          PY

      - name: Upload UI pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-ui-report
          path: reports/pytest-ui.xml
          if-no-files-found: warn
          retention-days: 7
