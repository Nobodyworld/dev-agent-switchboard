  workload-factory-coverage:
    name: Workload factory coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Validate source-controlled workload catalog offline
        run: python scripts/dev.py validate-workload-catalog

      - name: Measure source-controlled factory and catalog-readiness coverage
        run: |
          mkdir -p reports
          pytest \
            server/tests/test_workload_profiles.py \
            server/tests/test_catalog_readiness.py \
            --cov=server.execution.workload_profiles \
            --cov=server.execution.service \
            --cov-report=term-missing \
            --cov-report=json:reports/workload-factory-coverage.json -rA

      - name: Enforce reviewed factory and readiness coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          REPORT = Path('reports/workload-factory-coverage.json')
          TARGETS = {
              'server/execution/workload_profiles.py': {
                  'label': 'security-critical workload profile validation',
                  'functions': {
                      '_validate_relative_path',
                      '_validate_fixed_argv',
                      '_validate_environment',
                      '_validate_capabilities',
                      'ArtifactDeclaration.from_mapping',
                      'ArtifactDeclaration.__post_init__',
                      'ResultContract.from_mapping',
                      'ResultContract._validate_source',
                      'ResultContract._validate_numeric_limits',
                      'ResultContract._validate_declared_fields',
                      'ResultContract._validate_parser_rules',
                      'ResourceLimits.from_mapping',
                      'ResourceLimits.__post_init__',
                      'WorkloadStep.from_mapping',
                      'WorkloadStep.__post_init__',
                      'WorkloadProfile.from_mapping',
                      'WorkloadProfile.__post_init__',
                      'validate_workload_profiles',
                      '_profile_manifest_arguments',
                      'compile_trusted_manifests',
                  },
              },
              'server/execution/service.py': {
                  'label': 'catalog-readiness projection',
                  'functions': {
                      '_safe_runtime_requirements',
                      '_catalog_primary_blocker',
                      '_catalog_latest_result',
                      '_catalog_exclusions',
                      'ExecutionService.assess_catalog_readiness',
                  },
              },
          }
          MINIMUM_PERCENT = 90.0
          MAX_REPORT_BYTES = 2_000_000
          MAX_SOURCE_BYTES = 1_000_000

          class Definitions(ast.NodeVisitor):
              def __init__(self):
                  self.scope = []
                  self.ranges = {}

              def visit_ClassDef(self, node):
                  self.scope.append(node.name)
                  self.generic_visit(node)
                  self.scope.pop()

              def visit_FunctionDef(self, node):
                  self._record(node)
                  self.generic_visit(node)

              def visit_AsyncFunctionDef(self, node):
                  self._record(node)
                  self.generic_visit(node)

              def _record(self, node):
                  self.ranges['.'.join([*self.scope, node.name])] = (
                      node.lineno,
                      node.end_lineno,
                  )

          if not REPORT.is_file() or REPORT.stat().st_size > MAX_REPORT_BYTES:
              raise SystemExit('Coverage report is missing or exceeds the read limit.')
          report = json.loads(REPORT.read_text(encoding='utf-8'))
          files = report.get('files')
          if not isinstance(files, dict):
              raise SystemExit('Coverage report does not contain file data.')

          for relative_path, specification in TARGETS.items():
              info = next(
                  (
                      value
                      for candidate, value in files.items()
                      if candidate.replace('\\', '/').endswith(relative_path)
                  ),
                  None,
              )
              if not isinstance(info, dict):
                  raise SystemExit(f'Missing coverage data for {relative_path}.')
              executed = set(info.get('executed_lines', []))
              missing = set(info.get('missing_lines', []))
              statements = executed | missing
              source = Path(relative_path)
              if not source.is_file() or source.stat().st_size > MAX_SOURCE_BYTES:
                  raise SystemExit(f'Coverage source is missing or exceeds the read limit: {relative_path}.')
              definitions = Definitions()
              definitions.visit(ast.parse(source.read_text(encoding='utf-8')))
              expected = specification['functions']
              absent = sorted(expected - set(definitions.ranges))
              if absent:
                  raise SystemExit(
                      f'Coverage target changed without review: {relative_path}: {absent}'
                  )
              selected = set()
              for name in expected:
                  start, end = definitions.ranges[name]
                  selected.update(
                      line for line in statements if start <= line <= end
                  )
              if not selected:
                  raise SystemExit(f'No executable coverage lines found for {relative_path}.')
              covered = len(selected & executed)
              percent = (100.0 * covered) / len(selected)
              print(
                  f"{specification['label']}: {covered}/{len(selected)} lines "
                  f'({percent:.2f}%)'
              )
              if percent + 1e-6 < MINIMUM_PERCENT:
                  raise SystemExit(
                      f"{specification['label']} coverage {percent:.2f}% is below "
                      f'the required {MINIMUM_PERCENT:.2f}%.'
                  )
          PY

  docs:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install lychee
        shell: bash
        run: |
          set -euo pipefail
          LYCHEE_VERSION="0.24.2"
          TARGET="x86_64-unknown-linux-gnu"
          ARCHIVE="lychee-${TARGET}.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp
          install -m 0755 "/tmp/lychee-${TARGET}/lychee" "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check links
        id: linkcheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p lychee
          lychee --config lychee.toml --no-progress \
            README.md CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
            "docs/**/*.md" \
            --exclude-path docs/history \
            --exclude-path archive \
            2>&1 | tee lychee/console.log

      - name: Show link-check report
        if: always()
        shell: bash
        run: |
          if [[ -f lychee/out.md ]]; then
            cat lychee/out.md
          elif [[ -f lychee/console.log ]]; then
            cat lychee/console.log
          else
            echo "Lychee produced no report or console log."
          fi

      - name: Upload lychee diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lychee-report
          path: lychee/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce link-check result
        if: steps.linkcheck.outcome == 'failure'
        run: exit 1

  secrets:
    name: Secrets audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            --output "/tmp/${ARCHIVE}"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/${ARCHIVE}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run gitleaks
        run: gitleaks detect --verbose

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Run coverage suite
        run: |
          mkdir -p reports
          pytest --cov=server/extensions --cov=server.application.task_service --cov=server.observability --cov=server.application.configuration_service --cov-report=term-missing --cov-report=json:reports/coverage.json

      - name: Enforce coverage thresholds
        run: |
          python scripts/dev.py coverage-gate --json reports/coverage.json \
            --module server/extensions/contracts.py=85 \
            --module server/extensions/interfaces.py=85 \
            --module server/extensions/loader.py=85 \
            --module server/extensions/runtime.py=85 \
            --module server/extensions/builtin/task_metrics.py=85 \
            --module server/extensions/builtin/plan_metrics.py=85 \
            --module server/extensions/builtin/plan_latency.py=80 \
            --module server/extensions/builtin/plan_snapshot.py=80 \
            --module server/extensions/builtin/activity_feed.py=85 \
            --module server/extensions/observability.py=80 \
            --module server/observability/diagnostics.py=80 \
            --module server/observability/health.py=85 \
            --module server/observability/activity.py=80 \
            --module server/observability/overview.py=85 \
            --module server/application/task_service.py=75 \
            --module server/application/configuration_service.py=85

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-json
          path: reports/coverage.json
          if-no-files-found: warn
          retention-days: 7

  browser-ui:
    name: Browser UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run UI module with strict browser enforcement
        env:
          SWITCHBOARD_STRICT_PLAYWRIGHT: '1'
        run: |
          mkdir -p reports
          pytest web/tests/test_ui.py --junitxml=reports/pytest-ui.xml -rA

      - name: Fail if UI tests were skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('reports/pytest-ui.xml').getroot()
          skipped = sum(
              int(node.attrib.get('skipped', '0'))
              for node in root.iter('testsuite')
          )
          if skipped:
              raise SystemExit(
                  f'UI test module reported {skipped} skipped tests; failing by policy.'
              )
          print('UI module executed without skips.')
          PY

      - name: Upload UI pytest report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-ui-report
          path: reports/pytest-ui.xml
          if-no-files-found: warn
          retention-days: 7
