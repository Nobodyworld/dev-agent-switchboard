name: PR 116 pinned formatting

on:
  push:
    branches:
      - feat/execution-plane-contracts

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Nobodyworld/dev-agent-switchboard' && github.ref == 'refs/heads/feat/execution-plane-contracts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/execution-plane-contracts
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install pinned validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt
          python -m pip install pre-commit

      - name: Apply the proven ruff-format correction
        shell: bash
        run: |
          set +e
          python -m pre_commit run ruff-format --files \
            server/execution/repository.py \
            server/execution/service.py \
            server/tests/test_execution_concurrency.py \
            server/tests/test_execution_contracts.py
          set -e
          python -m pre_commit run --all-files --show-diff-on-failure
          git diff --check

      - name: Verify generated scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(server/execution/repository.py|server/execution/service.py|server/tests/test_execution_concurrency.py|server/tests/test_execution_contracts.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit generated formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/execution/repository.py \
            server/execution/service.py \
            server/tests/test_execution_concurrency.py \
            server/tests/test_execution_contracts.py
          git commit -m "style(execution): apply pinned ruff formatting"
          git push origin HEAD:feat/execution-plane-contracts
