name: PR 116 correction evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.number == 116 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/execution-plane-contracts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/execution-plane-contracts
          fetch-depth: 0
          persist-credentials: true

      - name: Update living ExecPlan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.agent/execplans/006_execution_plane_contracts.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '- [ ] Open a draft PR linked to #112 and update this plan with evidence.',
              '- [x] Open a draft PR linked to #112 and update this plan with evidence.',
          )
          marker = '## Hosted Correction Record (2026-07-14)'
          if marker not in text:
              block = '''\n## Hosted Correction Record (2026-07-14)\n\n- The implementation agent reported a clean local validation result on original\n  head `49b439d1088184a347ee6bd663f2a2feac784138`, including `252 passed,\n  2 skipped` and a local pre-commit pass.\n- Hosted CI run `29217558075` on that exact head passed tests, type checking,\n  security, link validation, and full-history Gitleaks, but pinned\n  `ruff-format` modified four files. Coverage and strict browser jobs were\n  skipped because lint failed.\n- The connector synchronized the branch with public `main`\n  `99887b4eca4c2d9aedf8ca6e3d7485cdcdd656aa` using reviewed two-parent merge\n  commit `a643e65fef1413c18398e0a5735ffc58540236dc`. No implementation conflict\n  occurred; only the public-preview documentation was added.\n- Diagnostic workflow run `29309490743` reproduced the repository-pinned hook\n  and proved that only `server/execution/repository.py`,\n  `server/execution/service.py`, `server/tests/test_execution_concurrency.py`,\n  and `server/tests/test_execution_contracts.py` required line-wrap changes.\n- The branch now contains exactly those four hook-generated changes. No runtime\n  behavior, dependency, authentication, lifecycle, security, or test assertion\n  changed. The normal public hosted matrix on the final branch head is the\n  authoritative acceptance evidence and is recorded in PR #116.\n'''
              text = text.replace('\n## Context and Orientation\n', block + '\n## Context and Orientation\n')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Verify generated scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [[ "$changed" != ".agent/execplans/006_execution_plane_contracts.md" ]]; then
            echo "Unexpected generated changes:"
            echo "$changed"
            exit 1
          fi

      - name: Commit ExecPlan evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "ExecPlan evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/execplans/006_execution_plane_contracts.md
          git commit -m "docs(execution): record hosted correction evidence"
          git push origin HEAD:feat/execution-plane-contracts
