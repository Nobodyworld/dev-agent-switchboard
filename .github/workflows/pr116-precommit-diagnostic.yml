name: PR 116 pre-commit diagnostic

on:
  push:
    branches:
      - feat/execution-plane-contracts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt

      - name: Capture pinned pre-commit changes
        shell: bash
        run: |
          set +e
          python -m pre_commit run --all-files --show-diff-on-failure
          exit_code=$?
          printf '%s\n' "$exit_code" > pr116-precommit-exit-code.txt
          git status --short > pr116-precommit-status.txt
          git diff --binary --full-index > pr116-precommit.patch
          exit 0

      - name: Upload diagnostic patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr116-precommit-diagnostic
          path: |
            pr116-precommit-exit-code.txt
            pr116-precommit-status.txt
            pr116-precommit.patch
          if-no-files-found: error
          retention-days: 1
