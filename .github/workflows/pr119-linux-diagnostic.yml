name: PR 119 Linux diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.number == 119 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pull-based-local-worker'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt
          python -m pip install pre-commit

      - name: Capture pinned pre-commit
        shell: bash
        run: |
          set +e
          python -m pre_commit run --all-files --show-diff-on-failure --verbose 2>&1 | tee pr119-precommit-linux.txt
          printf '%s\n' "${PIPESTATUS[0]}" > pr119-precommit-linux-exit.txt
          git diff --binary --full-index > pr119-precommit-linux.patch
          git status --short > pr119-precommit-linux-status.txt
          exit 0

      - name: Capture Mypy
        shell: bash
        run: |
          set +e
          mypy --config-file mypy.ini server client scripts 2>&1 | tee pr119-mypy-linux.txt
          printf '%s\n' "${PIPESTATUS[0]}" > pr119-mypy-linux-exit.txt
          exit 0

      - name: Upload Linux diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr119-linux-diagnostic
          path: |
            pr119-precommit-linux.txt
            pr119-precommit-linux-exit.txt
            pr119-precommit-linux.patch
            pr119-precommit-linux-status.txt
            pr119-mypy-linux.txt
            pr119-mypy-linux-exit.txt
          if-no-files-found: error
          retention-days: 1
