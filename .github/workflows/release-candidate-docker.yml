name: Release candidate Docker validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: release-candidate-docker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-build:
    if: github.event.pull_request.head.ref == 'release/public-preview-candidate-validation'
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: b79aba1aaf72ffd20f0221bdf0fd77552541073f
      IMAGE_TAG: switchboard-release-candidate:b79aba1aaf72
      EVIDENCE_FILE: /tmp/release-candidate-docker-evidence.txt
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate identity and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Show Docker version
        run: docker version

      - name: Build the exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag "${IMAGE_TAG}" -f server/Dockerfile .

      - name: Record Docker image identity
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format='{{.Id}}' "${IMAGE_TAG}")"
          docker_client="$(docker version --format='{{.Client.Version}}')"
          docker_server="$(docker version --format='{{.Server.Version}}')"
          test -n "${image_id}"
          test -n "${docker_client}"
          test -n "${docker_server}"
          printf 'candidate=%s\nimage_id=%s\ndocker_client=%s\ndocker_server=%s\n' \
            "${CANDIDATE_SHA}" "${image_id}" "${docker_client}" "${docker_server}" \
            | tee "${EVIDENCE_FILE}"
          {
            echo '### Exact release-candidate Docker build'
            echo
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Image ID: \`${image_id}\`"
            echo "- Docker client: \`${docker_client}\`"
            echo "- Docker server: \`${docker_server}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload bounded Docker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-docker-evidence
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 1

      - name: Verify source remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1)"
