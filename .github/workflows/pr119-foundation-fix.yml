name: PR 119 foundation correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    if: github.event.pull_request.number == 119 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pull-based-local-worker'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/pull-based-local-worker
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install validation tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements-dev.txt
          python -m pip install pre-commit

      - name: Apply savepoint-backed manifest synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/execution/repository.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from sqlalchemy import case, delete, select, update\nfrom sqlalchemy.ext.asyncio import AsyncSession\n"
          new_import = "from sqlalchemy import case, delete, select, update\nfrom sqlalchemy.exc import IntegrityError\nfrom sqlalchemy.ext.asyncio import AsyncSession\n"
          if old_import not in text:
              raise SystemExit("expected SQLAlchemy import block was not found")
          text = text.replace(old_import, new_import, 1)

          old_method = '''    async def ensure_manifest(self, definition: TrustedManifest) -> CommandManifest:\n        """Persist a trusted identity once and reject a conflicting snapshot."""\n\n        existing = await self.get_manifest(definition.name, definition.version)\n        if existing is not None:\n            if not _matches_trusted_manifest(existing, definition):\n                raise ManifestIntegrityError("trusted_manifest_digest_conflict")\n            return existing\n        manifest = CommandManifest(\n            name=definition.name,\n            version=definition.version,\n            schema_version=definition.schema_version,\n            digest=definition.digest,\n            description=definition.description,\n            trusted_registry_source=definition.registry_source,\n            required_capabilities=definition.required_capabilities,\n            fixed_step_metadata=definition.fixed_step_metadata,\n            environment_policy=definition.environment_policy,\n            network_policy=definition.network_policy,\n            repository_write_policy=definition.repository_write_policy,\n            timeout_seconds=definition.timeout_seconds,\n            artifact_declarations=definition.artifact_declarations,\n        )\n        self.session.add(manifest)\n        await self.session.flush()\n        return manifest\n'''
          new_method = '''    async def ensure_manifest(self, definition: TrustedManifest) -> CommandManifest:\n        """Persist a trusted identity once and reject a conflicting snapshot."""\n\n        existing = await self.get_manifest(definition.name, definition.version)\n        if existing is not None:\n            if not _matches_trusted_manifest(existing, definition):\n                raise ManifestIntegrityError("trusted_manifest_digest_conflict")\n            return existing\n        manifest = CommandManifest(\n            name=definition.name,\n            version=definition.version,\n            schema_version=definition.schema_version,\n            digest=definition.digest,\n            description=definition.description,\n            trusted_registry_source=definition.registry_source,\n            required_capabilities=definition.required_capabilities,\n            fixed_step_metadata=definition.fixed_step_metadata,\n            environment_policy=definition.environment_policy,\n            network_policy=definition.network_policy,\n            repository_write_policy=definition.repository_write_policy,\n            timeout_seconds=definition.timeout_seconds,\n            artifact_declarations=definition.artifact_declarations,\n        )\n        try:\n            async with self.session.begin_nested():\n                self.session.add(manifest)\n                await self.session.flush()\n        except IntegrityError as error:\n            existing = await self.get_manifest(definition.name, definition.version)\n            if existing is None or not _matches_trusted_manifest(existing, definition):\n                raise ManifestIntegrityError(\n                    "trusted_manifest_digest_conflict"\n                ) from error\n            return existing\n        return manifest\n'''
          if old_method not in text:
              raise SystemExit("expected ensure_manifest implementation was not found")
          path.write_text(text.replace(old_method, new_method, 1), encoding="utf-8")
          PY

      - name: Apply and verify pinned formatting
        shell: bash
        run: |
          set +e
          python -m pre_commit run --all-files --show-diff-on-failure
          set -e
          python -m pre_commit run --all-files --show-diff-on-failure
          git diff --check

      - name: Run focused foundation and concurrency tests
        run: |
          pytest \
            client/python/tests/test_execution_worker_foundations.py \
            server/tests/test_execution_worker_manifest.py \
            server/tests/test_execution_concurrency.py::test_two_workers_concurrently_checkout_exactly_one_run_file_backed_sqlite \
            -q

      - name: Verify correction scope
        shell: bash
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(server/execution/repository.py|server/execution/registry.py|server/tests/test_execution_worker_manifest.py|client/python/execution_worker/[^/]+\.py|client/python/tests/test_execution_worker_foundations.py|\.agent/execplans/007_pull_based_local_worker.md)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit validated correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No correction remains to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/execution/repository.py \
            server/execution/registry.py \
            server/tests/test_execution_worker_manifest.py \
            client/python/execution_worker \
            client/python/tests/test_execution_worker_foundations.py \
            .agent/execplans/007_pull_based_local_worker.md
          git commit -m "fix(worker): harden concurrent manifest synchronization"
          git push origin HEAD:feat/pull-based-local-worker
