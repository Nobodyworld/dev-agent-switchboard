name: Temporary stale branch cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.number == 119 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/pull-based-local-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete approved stale branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: feat/pull-based-local-worker
        run: |
          python - <<'PY'
          from __future__ import annotations

          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          current_head = os.environ["GITHUB_HEAD_REF"]
          expected_head = os.environ["EXPECTED_HEAD"]

          stale_branches = (
              "docs/public-showcase-final-alignment",
              "chore/security-dependabot-public-readiness",
              "docs/public-showcase-governance",
              "fix/actions-startup-failure",
              "security-private-deferral",
              "backup/pr116-sync-3cd5e6e",
          )

          if current_head != expected_head:
              raise SystemExit(
                  f"refusing cleanup from unexpected PR head: {current_head!r}"
              )

          forbidden = {"main", current_head}
          overlap = forbidden.intersection(stale_branches)
          if overlap:
              raise SystemExit(f"refusing forbidden branch deletion: {sorted(overlap)}")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "switchboard-branch-cleanup",
          }

          for branch in stale_branches:
              encoded_branch = urllib.parse.quote(branch, safe="/")
              url = (
                  f"https://api.github.com/repos/{repository}/git/refs/heads/"
                  f"{encoded_branch}"
              )
              request = urllib.request.Request(
                  url,
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          raise RuntimeError(
                              f"unexpected deletion status for {branch}: "
                              f"{response.status}"
                          )
                  print(f"deleted {branch}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"already absent {branch}")
                      continue
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"failed to delete {branch}: HTTP {error.code}: {detail}"
                  ) from error
          PY
