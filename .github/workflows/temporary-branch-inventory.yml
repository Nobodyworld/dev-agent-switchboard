name: Temporary branch inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-branch-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.event.pull_request.number == 119 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/pull-based-local-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List all remote branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "switchboard-branch-inventory",
          }

          branches: list[str] = []
          page = 1
          while True:
              query = urllib.parse.urlencode({"per_page": 100, "page": page})
              url = f"https://api.github.com/repos/{repository}/branches?{query}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not payload:
                  break
              branches.extend(item["name"] for item in payload)
              if len(payload) < 100:
                  break
              page += 1

          print(f"branch_count={len(branches)}")
          for branch in sorted(branches):
              print(f"branch={branch}")
          PY
