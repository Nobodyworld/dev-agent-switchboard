version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/server"
      - "/client/python"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "monthly"
      time: "04:15"
      timezone: "UTC"
    open-pull-requests-limit: 1
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:30"
      timezone: "UTC"
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
