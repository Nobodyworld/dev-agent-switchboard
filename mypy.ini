[mypy]
python_version = 3.11
warn_unused_configs = True
show_error_codes = True
warn_unused_ignores = True
follow_imports = normal
implicit_reexport = False
namespace_packages = True

[mypy-tests.*]
allow_untyped_defs = True
allow_untyped_calls = True
allow_incomplete_defs = True
allow_untyped_decorators = True

[mypy-client.python.tests.*]
ignore_errors = True

[mypy-client.python.switchboard_cli]
strict = True

[mypy-switchboard_cli]
strict = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

[mypy-prometheus_fastapi_instrumentator.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-radon.*]
ignore_missing_imports = True

[mypy-server.instrumentation.*]
ignore_errors = True

[mypy-server.observability.*]
ignore_errors = True

[mypy-server.extensions.builtin.*]
ignore_errors = True

[mypy-server.extensions.observability]
ignore_errors = True

[mypy-server.api.*]
allow_untyped_defs = True
allow_untyped_calls = True
disable_error_code = arg-type, return-value, no-any-return, no-redef, no-untyped-def, unused-ignore

[mypy-server.application.*]
allow_untyped_defs = True
disable_error_code = no-untyped-def

[mypy-server.extensions.interfaces]
allow_untyped_defs = True
disable_error_code = no-untyped-def

[mypy-server.extensions.contracts]
disable_error_code = arg-type

[mypy-server.infrastructure.repositories]
disable_error_code = attr-defined

[mypy-server.models]
disable_error_code = misc

[mypy-server.db]
disable_error_code = call-overload

[mypy-server.middleware.*]
allow_untyped_defs = True
disable_error_code = no-untyped-def, unused-ignore

[mypy-server.task_logic]
allow_untyped_defs = True
disable_error_code = no-untyped-def

[mypy-server.app]
allow_untyped_defs = True
disable_error_code = no-untyped-def

[mypy-tests.test_shims]
ignore_errors = True

[mypy-server.migrations.*]
ignore_errors = True

[mypy-server.tests.*]
ignore_errors = True
