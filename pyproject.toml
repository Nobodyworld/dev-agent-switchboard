[tool.black]
line-length = 88
target-version = ["py311"]
include = '\\.(py|pyi)$'

[tool.ruff]
line-length = 88
src = ["server", "client", "scripts", "tests"]
fix = true

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "ASYNC",
  "A",
  "COM",
  "DTZ",
  "S",
  "TID",
  "SIM",
  "ARG",
  "PL",
  "RUF"
]
ignore = [
  "S101",  # allow assert in tests
  "COM812",  # handled by formatter
  "SIM105"   # allow context-specific comprehensions
]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"scripts/**" = ["T201"]
"client/python/switchboard_cli.py" = ["PLR0915"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["server", "client"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "asyncio: mark a test as using asyncio",
]
